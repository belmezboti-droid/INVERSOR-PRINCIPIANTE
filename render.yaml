services:
  - type: web
    name: cuaderno-del-inversor
    runtime: node
    plan: starter
    buildCommand: if [ -f package-lock.json ]; then npm ci --omit=dev; else npm install --omit=dev; fi
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATA_DIR
        value: /var/data
      - key: TRUST_PROXY
        value: "1"
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: AI_DAILY_LIMIT
        value: "500"
    disk:
      name: datos
      mountPath: /var/data
      sizeGB: 1
