services:
  - type: web
    name: cuaderno-del-inversor
    runtime: node
    plan: starter
    buildCommand: npm install --omit=dev
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATA_DIR
        value: /var/data
      - key: TRUST_PROXY
        value: "1"
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ADMIN_EMAILS
        sync: false
    disk:
      name: datos
      mountPath: /var/data
      sizeGB: 1
